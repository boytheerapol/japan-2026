<!doctype html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#16120f">
  <title>เรื่องเล่าทริป · Japan 2026</title>
  <meta name="description" content="เล่าทริปญี่ปุ่น 11 วัน ฟูจิ · ชิซุโอกะ · อิซุ · คามาคุระ · โตเกียว แบบ animation">
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@600;700&family=Shippori+Mincho:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="story.css">
</head>
<body>
  <div class="app" id="app">
    <a class="back" href="../" aria-label="กลับหน้าเว็บทริป">← Japan 2026</a>

    <main class="stage" id="stage" aria-live="off">
      <!-- photo side -->
      <section class="photo" id="photo" aria-hidden="true">
        <div class="frame" data-slot="a"></div>
        <div class="frame" data-slot="b"></div>
        <div class="card-layer" id="cardLayer"></div>
      </section>

      <!-- map side -->
      <section class="map" id="mapWrap" aria-hidden="true">
        <svg id="map" preserveAspectRatio="none">
          <path id="landJapan" class="land"/>
          <path id="landRegion" class="land"/>
          <path id="lakes" class="lake"/>
          <g id="routes"></g>
        </svg>
        <div class="markers" id="markers"></div>
        <div class="odo" id="odo" hidden></div>
      </section>

      <!-- full-screen scenes (title / chapter / outro) -->
      <section class="overlay" id="overlay" aria-hidden="true"></section>

      <!-- falling leaves / sparkles -->
      <canvas class="fx" id="fx" aria-hidden="true"></canvas>

      <!-- subtitle -->
      <div class="subtitle" id="subtitle" aria-live="polite"><span></span></div>

      <!-- start gate: needed so iOS allows audio -->
      <button class="gate" id="gate" type="button">
        <span class="gate-jp">晩秋の旅</span>
        <span class="gate-play" aria-hidden="true">▶</span>
        <span class="gate-label">เริ่มฟังเรื่องเล่าทริป</span>
        <span class="gate-hint">เปิดเสียงด้วยนะ</span>
      </button>
    </main>

    <!-- controls -->
    <footer class="controls" id="controls">
      <div class="scrub">
        <div class="ticks" id="ticks"></div>
        <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="เลื่อนเวลา">
      </div>
      <div class="bar">
        <button id="play" class="btn primary" type="button" aria-label="เล่น">▶</button>
        <span class="time" id="time">0:00 / 0:00</span>
        <nav class="days" id="days" aria-label="ไปยังวัน"></nav>
        <span class="spacer"></span>
        <button id="music" class="btn" type="button" aria-pressed="true" aria-label="เพลง">♪</button>
        <input id="vol" class="vol" type="range" min="0" max="100" value="45" aria-label="ความดังเพลง">
        <button id="tx" class="btn" type="button" aria-pressed="false" aria-label="Transcript">📜</button>
        <button id="fs" class="btn" type="button" aria-label="เต็มจอ">⛶</button>
      </div>
    </footer>

    <!-- transcript drawer -->
    <aside class="drawer" id="drawer" hidden>
      <header><h2>Transcript</h2><button class="btn" id="txClose" type="button" aria-label="ปิด">✕</button></header>
      <ol id="txList"></ol>
    </aside>
  </div>

  <script src="story.js"></script>
</body>
</html>
